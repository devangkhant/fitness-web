<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        nav ul {
            height: auto;
            width: 100%;
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        li {
            margin: 10px;
            padding: 10px;
            display: inline;
            border: 2px solid black;
            border-radius: 5px;
        }

</html>
