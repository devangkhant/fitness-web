<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>

<body>
    <!--Unordered list-->
    <ul type="square">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
        <li>Help</li>
    </ul>

    <!--Ordered list-->
    <ol type="I">
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
        <li>Papaya</li>
    </ol>

</body>

</html>
